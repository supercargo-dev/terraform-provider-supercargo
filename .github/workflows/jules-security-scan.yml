name: Jules Daily Security Scan
on:
  schedule:
    - cron: '0 3 * * *' # Every day at 3 AM UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Invoke Jules Security Scan
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          STARTING_BRANCH: 'main'
          REPO_FULL_NAME: ${{ github.repository }}
          USER_PROMPT: |
            You are a senior adversarial security researcher. Your objective is to proactively hunt for vulnerabilities in the Supercargo Terraform Provider.
            
            Thoroughly scan the codebase and implement fixes for any of the following if found:
            - **State Security:** Are sensitive values (passwords, tokens, private keys) failing to be marked as `Sensitive: true` in the schema? This causes them to leak in plaintext Terraform state files or CLI output.
            - **Injection:** Look for command injection or insecure URL construction when the provider communicates with backend APIs.
            - **Secrets:** Hardcoded credentials or API keys within the provider code or tests.
            - **Validation:** Missing validation for inputs that could cause backend systems to crash or misbehave when processing terraform apply.
            
            **Context Awareness:** Before injecting new methods or logic, you MUST explicitly scan the file to ensure an implementation doesn't already exist. Never create duplicate function declarations.
            **Compile-Ready Code:** Ensure your code passes strict compilation (`go vet`).
            **Language Context:** This project uses Go 1.26+. Leverage modern Go features and do NOT revert them (e.g. loop variable captures).

            If you find a high or critical severity vulnerability, open a pull request immediately with a targeted, minimal fix. 
            Do not make changes to business logic unrelated to the security fix. Ensure all existing tests pass and the schema remains backward compatible.
        run: |
          jq -n \
            --arg prompt "$USER_PROMPT" \
            --arg branch "$STARTING_BRANCH" \
            --arg repo "$REPO_FULL_NAME" \
            '{
              "prompt": $prompt,
              "sourceContext": {
                "source": "sources/github/\($repo)",
                "githubRepoContext": {
                  "startingBranch": $branch
                }
              },
              "requirePlanApproval": false,
              "automationMode": "AUTO_CREATE_PR"
            }' > jules_payload.json

          curl --fail -sS -X POST 'https://jules.googleapis.com/v1alpha/sessions' \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -d @jules_payload.json
